plugins { id 'com.android.application' }

android {
    namespace 'dev.vcmi.builds'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.vcmi.builds'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.0'
        testInstrumentationRunner 'dev.vcmi.builds.TokenStoreInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        helper {
            if (System.getenv('HELPER_SIGNING_STORE')) {
                storeFile file(System.getenv('HELPER_SIGNING_STORE'))
                storePassword System.getenv('HELPER_SIGNING_PASSWORD')
                keyAlias 'vcmi-builds'
                keyPassword System.getenv('HELPER_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('HELPER_SIGNING_STORE')) signingConfig signingConfigs.helper
        }
        release { signingConfig signingConfigs.helper }
    }
}
