name: Build VCMI helper APK
on:
  push:
    branches: [codex/vcmi-builds-helper]
    paths:
      - 'tools/vcmi-builds/**'
      - '.github/workflows/vcmi-builds-helper.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/vcmi-builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and lint helper
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify package and signature
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vcmi-builds.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt" dump badging vcmi-builds.apk | grep "package: name='dev.vcmi.builds'"
          "$build_tools/apksigner" verify --verbose vcmi-builds.apk
          sha256sum vcmi-builds.apk > vcmi-builds.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vcmi-builds-installer
          path: |
            tools/vcmi-builds/vcmi-builds.apk
            tools/vcmi-builds/vcmi-builds.apk.sha256
          if-no-files-found: error
          retention-days: 14
