name: Thor Slice 6 validation

on:
  push:
    branches:
      - ci/thor-slice6-validation
  workflow_dispatch:

jobs:
  arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          pipx install conan
          source CI/install_conan_dependencies.sh dependencies-android-arm64-v8a
          conan profile detect
          conan install . --output-folder=conan-generated --build=never \
            --profile=dependencies/conan_profiles/base/android-system \
            --profile=dependencies/conan_profiles/android-64-ndk \
            --conf='tools.cmake.cmaketoolchain:generator=Ninja'
      - name: Configure Thor ARM64
        run: cmake --preset android-thor-release -DANDROID_ABI=arm64-v8a -DENABLE_TEST=ON
      - name: Build Thor ARM64 APK
        run: cmake --build --preset android-thor-release
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Run focused native tests
        run: ctest --test-dir out/build/android-thor-release -R ThorContext --output-on-failure
      - name: Run focused Android tests
        working-directory: out/build/android-thor-release/android
        run: ./gradlew :vcmi-app:testDebugUnitTest --tests eu.vcmi.vcmi.ThorContextIdsTest
      - name: Verify and checksum APK
        run: |
          apk=$(find out/build/android-thor-release -type f -name '*arm64-v8a*.apk' -o -name '*.apk' | head -n 1)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apkanalyzer" manifest application-id "$apk" | grep -Fx is.xyz.vcmi.thor
          sha256sum "$apk" | tee "$apk.sha256"
          cp "$apk" thor-slice6-arm64.apk
          cp "$apk.sha256" thor-slice6-arm64.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: thor-slice6-arm64
          path: |
            thor-slice6-arm64.apk
            thor-slice6-arm64.apk.sha256
